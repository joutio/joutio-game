spring:
  config:
    import: optional:classpath:joutio-defaults.yml
  profiles:
    default: local

  application:
    name: joutio-game

  flyway:
    locations: classpath:db/migration/game

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

microservice:
  swagger:
    description: Joutio Game Module - Game sessions and gameplay management
  websocket:
    # Surface REST/WS portée par le BFF ; les services sont headless.
    enabled: false


joutio:
  axon:
    # Groupes chauds segmentés : un thread par segment et par réplique, répartition entre
    # répliques par le rééquilibreur du SDK. Appliqué à la création du token (base vierge).
    processors:
      game-flow-saga:
        segments: 4
      game-projection:
        segments: 4
